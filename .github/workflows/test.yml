# infra/ のテストを PR とマージ時に走らせる（Issue #82 のレビュー指摘）。
#
# これまで infra のテストは CI のどこでも実行していなかった。cdk-diff は diff を
# 出すだけ、deploy は deploy するだけで、このリポジトリは無料プランのため
# ブランチ保護も使えない。テストは書いてあるのに、壊れたまま main へ入って
# デプロイまで通る状態だった。
#
# AWS の認証は要らないので cdk-diff とは分けている。認証や AWS 側の都合で
# 落ちたときに、テストまで一緒に走らなくなるのを避けるため。
name: test

# paths にワークフロー全体を入れているのは、deploy.yml から npm test の行を
# 消すだけの PR でもこのワークフローを走らせるため。infra/** と test.yml だけに
# 絞ると、関門を外す変更そのものが無検査で通る。ブランチ保護が使えない以上、
# 走ったという事実だけが手がかりになる。
#
# フロント側（src/** と設定ファイル）も対象に入れている。lint は root の
# `eslint .` が infra と sommelier まで見るため、どちらの変更でも走らせて困らない
on:
  pull_request:
    paths:
      - 'infra/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'eslint.config.js'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'eslint.config.js'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/package-lock.json
      # --ignore-scripts はここにも付ける。PR のブランチをそのまま checkout する
      # 以上、lock に仕込まれたインストール時スクリプトを走らせない。
      # esbuild だけが hasInstallScript を持つが、無くても vitest の変換と
      # NodejsFunction のバンドルは動く（このワークフローが両方を通るので、
      # 動かなくなればここで落ちる）
      - run: npm ci --ignore-scripts
      # Lambda は1つずつ package.json を持ち、AWS SDK はそちらの依存にある。
      # infra 直下の npm ci だけでは入らないため、テストが SDK を import した
      # 時点で ERR_MODULE_NOT_FOUND になる（ローカルは過去の npm install が
      # 残っていて気づけない）。
      #
      # --ignore-scripts なのは、PR のブランチをそのまま checkout して入れる以上、
      # lock に細工されたライフサイクルスクリプトを走らせないため。8つの lock は
      # いずれも hasInstallScript を持たないので、付けても壊れるものが無い
      - name: Lambda ごとの依存を入れる
        run: |
          for dir in lambda/*/; do
            [ -f "${dir}package.json" ] || continue
            (cd "$dir" && npm ci --ignore-scripts)
          done
      - run: npx tsc --noEmit
      - run: npm test

  # フロント（src/**）は lint も型検査も CI のどこでも走っていなかった。infra の
  # テストと同じで、壊れても誰も気づかないまま main に入る状態だったため足す
  # （Issue #134）。infra のジョブとは分けて、片方が落ちてももう片方の結果が残るようにする
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      # --ignore-scripts の理由は infra ジョブと同じ。PR のブランチをそのまま
      # checkout する以上、lock に仕込まれたインストール時スクリプトは走らせない。
      # lint も tsc も vitest も esbuild のインストール時スクリプトを要らない
      # （バイナリは @esbuild/linux-x64 として入る）
      - run: npm ci --ignore-scripts
      - run: npm run lint
      # tsconfig.app.json はアプリ本体の設定。root の tsconfig.json は
      # プロジェクト参照だけなので、こちらを明示して検査する
      - run: npx tsc --noEmit -p tsconfig.app.json
      # src/ に絞る。root の vitest は infra と sommelier のテストまで拾うが、
      # それらの依存はそれぞれの node_modules にあるため import が解決できずに
      # 落ちる。infra のテストは上のジョブが見ているので、ここは重ならない
      - run: npx vitest run src/
