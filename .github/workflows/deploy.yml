# main へのマージで CDK スタックを自動デプロイする（Issue #94）。
# 認証はアクセスキーではなく GitHub OIDC（sakekasu-github-oidc スタックの
# deploy ロール）を使う。フロントは Amplify が別途自動デプロイするため、
# ここでは infra/ の変更だけを対象にする。ソムリエ（AgentCore）は
# デプロイ先のスタックが別なので deploy-sommelier.yml が受け持つ。
#
# デプロイは cdkd（CloudFormation を経由せず AWS SDK / Cloud Control API を
# 直に叩く）で行う（Issue #150）。取り込みが済んでいないスタックが残っている
# 間は migrate-to-cdkd.sh が検知して CloudFormation 側へフォールバックする。
name: deploy

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/deploy.yml'

permissions:
  id-token: write
  contents: read

# デプロイの同時実行を防ぐ。後続を打ち切らないのは、最後の main の状態を
# 必ず反映させるため（キャンセルすると古い状態のまま止まる恐れがある）
concurrency:
  group: cdk-deploy
  cancel-in-progress: false

env:
  # cdkd が直接読む。AWS への操作はこのロールで行われる。
  # CDK CLI の cdk-hnb659fds-* ロールは cdkd では使えない（CloudFormation を
  # 経由せず生の API を叩くため、必要な権限が別物になる）
  CDKD_ROLE_ARN: arn:aws:iam::232791540685:role/sakekasu-cdkd-deploy
  # 認証情報を入れる前に済ませた合成結果を使わせる。これを外すと cdkd が
  # 自分で合成し直し、CDK アプリのコードが認証情報付きで走ることになる
  CDKD_APP: cdk.out

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/package-lock.json
      # 依存の取得とテストは AWS の認証情報を入れる前に済ませる。
      #
      # npm のライフサイクルスクリプトはインストール時に任意のコードを実行できる。
      # 認証後に npm ci を走らせると、依存のどれか1つが乗っ取られただけで、
      # そのスクリプトが AWS_SESSION_TOKEN を読んで cdkd のデプロイロールへ
      # assume できてしまう（このロールはアプリのリソースを自由に操作できる）。
      # 認証前に済ませておけば、スクリプトが走っても掴めるものが無い。
      # そのうえで --ignore-scripts も付ける（多層で塞ぐ）。
      - run: npm ci --ignore-scripts
      # AWS SDK は Lambda ごとの package.json 側にある。テストが import するので
      # 入れておく（詳細は test.yml のコメント）。
      # --ignore-scripts なのは、8つの lock を調べていずれも
      # hasInstallScript を持たないため。付けても壊れるものが無い
      - name: Lambda ごとの依存を入れる
        run: |
          for dir in lambda/*/; do
            [ -f "${dir}package.json" ] || continue
            (cd "$dir" && npm ci --ignore-scripts)
          done
      # デプロイ直前の最後の関門。test ワークフローと重複するが、そちらは
      # paths 条件やマージの経路によっては走らないことがある。本番へ出す手前で
      # 必ず1回通す（Issue #82 のレビュー指摘）
      - run: npm test
      # 合成も認証情報を入れる前に済ませる（PR #151 のセキュリティレビュー）。
      #
      # --ignore-scripts が止めるのは npm のインストール時スクリプトだけで、
      # CDK アプリのコードは合成時に実行される。認証後に合成すると、そこに
      # 仕込まれた AWS SDK の呼び出しが認証情報付きで動く。
      # 以降は CDKD_APP=cdk.out でこの成果物を使い回し、二度と合成しない
      - name: 合成
        # CDK_DEFAULT_ACCOUNT は本来 CDK CLI が認証情報から入れる。認証前に
        # 合成するとこれが undefined になり、bin/app.ts の env.account が
        # 未定義のスタックになって、テンプレート中のアカウント ID が
        # Ref: AWS::AccountId に化ける。デプロイ時には同じ値に解決されるが、
        # 認証ありで合成した場合と別物のテンプレートになる。明示しておけば
        # 両者が一致する（Issue #131 に記録のある落とし穴）
        env:
          CDK_DEFAULT_ACCOUNT: '232791540685'
        run: npx cdk synth --all -q
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::232791540685:role/sakekasu-github-actions-deploy
          aws-region: ap-northeast-1
      # CloudFormation 管理のまま残っているスタックがあれば cdkd へ取り込む。
      # 取り込み済みなら何もしない（冪等）。前検査で1つでも引っかかれば、
      # どのスタックにも手を付けずに engine=cfn を返すので、その回は
      # CloudFormation 側でデプロイされる（詳細は docs/cdkd-migration.md の手順7）
      - name: cdkd への取り込み状態を確かめる
        id: migrate
        run: bash scripts/migrate-to-cdkd.sh
      # state に平文のシークレットが残っていないかの番人（PR #151 のレビュー）。
      # いまこのアプリの合成テンプレートに {{resolve:secretsmanager:...}} は無く
      # 残る余地も無いが、将来そうなったときに気づけるようにしておく
      - name: state に平文のシークレットが無いか
        if: steps.migrate.outputs.engine == 'cdkd'
        run: npx cdkd scrub --all --dry-run --fail
      # 待ちモードは既定のまま。デプロイ後にカナリアとアラームが動く構成なので
      # --no-wait は使わない
      - name: デプロイ（cdkd）
        if: steps.migrate.outputs.engine == 'cdkd'
        run: npx cdkd deploy --all --yes
      - name: デプロイ（CloudFormation へのフォールバック）
        if: steps.migrate.outputs.engine == 'cfn'
        run: npx cdk deploy --all --require-approval never --app cdk.out
