# main へのマージで CDK スタックを自動デプロイする（Issue #94）。
# 認証はアクセスキーではなく GitHub OIDC（sakekasu-github-oidc スタックの
# deploy ロール）を使う。フロントは Amplify が別途自動デプロイするため、
# ここでは infra/ の変更だけを対象にする。
name: deploy

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/deploy.yml'

permissions:
  id-token: write
  contents: read

# デプロイの同時実行を防ぐ。後続を打ち切らないのは、最後の main の状態を
# 必ず反映させるため（キャンセルすると古い状態のまま止まる恐れがある）
concurrency:
  group: cdk-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::<アプリのアカウント ID>:role/sakekasu-github-actions-deploy
          aws-region: ap-northeast-1
      - run: npm ci
      - run: npx cdk deploy --all --require-approval never
