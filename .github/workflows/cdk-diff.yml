# PR で差分を取り、結果を PR コメントに出す（Issue #94）。
# iPhone だけでレビューするための仕組み。使うのは読み取り専用の diff ロール
# なので、PR からリソースは変更できない。
#
# 差分は cdkd で取る（Issue #150）。cdkd は CDK bootstrap の lookup ロールに
# 入らず、自分の認証情報で各リソースを読む。diff ロールにはその読み取り権限
# だけが入っていて、書き込みは無い。
name: cdk-diff

on:
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/cdk-diff.yml'

permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: cdk-diff-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # 認証情報を入れる前に済ませた合成結果を使わせる（下の「合成」を参照）
  CDKD_APP: cdk.out

jobs:
  diff:
    # 本人が push した PR だけで走らせる（Issue sakekasu-builder-archive#131）。
    #
    # フォークからの PR には GitHub が OIDC トークンを渡さないので、走っても AWS には
    # 入れず落ちるだけ。条件で先に外し、赤い diff を残さない。
    #
    # Dependabot の PR は同じリポジトリのブランチから出るので、OIDC で diff ロールに
    # 入れてしまう。依存を上げる PR は lockfile の resolved がレジストリのままなので
    # 取得元の検査（下の check-lockfile-registry）を通り、乗っ取られた上流の版が
    # 混ざれば認証後に動く cdkd の中でそのコードが走る。人が差分を見る前に
    # 認証情報の付いた場所で動かさないため、Dependabot の PR では走らせない。
    # 依存を上げるだけの PR はインフラの差分をほとんど生まないので、失うものも小さい。
    #
    # github.actor は最後に push した人。Dependabot のブランチに本人が commit を
    # 足したときは本人の push として走る
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/package-lock.json
      # 依存の取得元がレジストリだけかを、取得より前に確かめる。
      #
      # lockfile は PR が書き換えられる。resolved を自前のターゲットへ向けて
      # 整合性ハッシュをそれに合わせると、認証後に動く cdkd 自体が PR のコードに
      # なる（aws-security-agent の指摘）。版を上げる PR は resolved が
      # レジストリのまま変わるだけなので、この検査では止まらない。
      # 塞げない範囲はスクリプトのコメントと Issue #131 にある
      - name: 依存の取得元を確かめる
        run: node scripts/check-lockfile-registry.mjs
      # 依存の取得は AWS の認証情報を入れる前に済ませる（deploy.yml と同じ理由）。
      # このワークフローは PR のブランチをそのまま checkout するので、lock を
      # 差し替えた PR を出せばインストール時スクリプトを走らせられる。認証後だと
      # そのスクリプトが diff ロールのセッショントークンを読める
      - run: npm ci --ignore-scripts
      # 合成で Lambda をバンドルするのに要る。@aws-sdk/* は実行環境にあるので
      # バンドルから外しているが、Claude API の SDK（lambda/shared の
      # @anthropic-ai/sdk）は外せず、Lambda ごとの node_modules から解決する。
      # 取得元は上の検査が Lambda ごとの lock まで見ている。--ignore-scripts と、
      # 認証情報より前に置く理由は deploy.yml と同じ
      - name: Lambda ごとの依存を入れる
        run: |
          for dir in lambda/*/; do
            [ -f "${dir}package.json" ] || continue
            (cd "$dir" && npm ci --ignore-scripts)
          done
      # 合成も認証情報を入れる前に済ませる（PR #151 のセキュリティレビュー）。
      #
      # --ignore-scripts が止めるのは npm のインストール時スクリプトだけで、
      # CDK アプリのコードは合成時に実行される。認証後に合成すると、PR に
      # 仕込んだ AWS SDK の呼び出しが diff ロールの認証情報付きで動いてしまう。
      # 合成を先に済ませ、以降は CDKD_APP=cdk.out でこの成果物だけを読ませる。
      #
      # 消えるのは「合成時にアプリのコードが走る」経路だけ。lockfile は PR が
      # 書き換えられるので、認証後に動く cdkd 自体が PR 由来である点は残る
      # （Issue #131 の1番。この順序替えは部分的な対処）
      - name: 合成
        # CDK_DEFAULT_ACCOUNT は本来 CDK CLI が認証情報から入れる。認証前に
        # 合成するとこれが undefined になり、bin/app.ts の env.account が
        # 未定義のスタック（environment-agnostic）になって、テンプレート中の
        # アカウント ID が Ref: AWS::AccountId に化ける。デプロイ時には同じ値に
        # 解決されるが、認証ありで合成した場合と別物のテンプレートになる。
        # 明示しておけば両者が一致する（Issue #131 に記録のある落とし穴）
        env:
          # アカウント ID は secrets から渡す（deploy.yml と同じ）。このジョブは本人の PR でしか
          # 走らないので（上の if:）、secrets は必ず渡る
          CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          # Agent Space の ARN は secrets から渡す（deploy.yml と同じ。bin/app.ts）。
          # フォークからの PR には secrets が渡らないので、そのときは DevOps Agent の
          # スタックを合成しないまま差分を取る
          AGENT_SPACE_ARN: ${{ secrets.AGENT_SPACE_ARN }}
        run: |
          if [ -z "$CDK_DEFAULT_ACCOUNT" ]; then
            echo "::error::secrets.AWS_ACCOUNT_ID が未設定。リポジトリの Settings → Secrets and variables → Actions に入れる（README の「デプロイ」）"
            exit 1
          fi
          if [ -n "$AGENT_SPACE_ARN" ]; then
            # 運用ツール用アカウントの ID をログに出さない
            echo "::add-mask::$(cut -d: -f5 <<< "$AGENT_SPACE_ARN")"
          fi
          npx cdk synth --all -q
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/sakekasu-github-actions-diff
          aws-region: ap-northeast-1
      - name: cdkd diff
        id: diff
        env:
          AGENT_SPACE_ARN: ${{ secrets.AGENT_SPACE_ARN }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        # --fail は付けない。差分があるだけで落ちてしまう。
        #
        # 一方で cdkd 自体が落ちたときは落ちてほしいので pipefail を立てる。
        # これが無いとパイプの終了コードが tee のものになり、cdkd が
        # エラーで止まってもステップが成功扱いになる（この形の最初の実行で、
        # 権限不足のエラーを出したまま diff チェックが緑になった）。
        # 出力は下のステップが if: always() で拾うので、落ちてもコメントは出る
        run: |
          set -o pipefail
          npx cdkd diff --all 2>&1 | tee diff.txt
          # diff.txt は PR コメントに貼る。ログのマスクは PR コメントには効かないので、
          # アプリ用と運用ツール用のアカウントの ID をここで伏せる
          sed -i "s/${AWS_ACCOUNT_ID}/<アカウント>/g" diff.txt
          if [ -n "$AGENT_SPACE_ARN" ]; then
            sed -i "s/$(cut -d: -f5 <<< "$AGENT_SPACE_ARN")/<運用アカウント>/g" diff.txt
          fi
      - name: PRコメントに diff を投稿（既存コメントは更新）
        if: always() && hashFiles('infra/diff.txt') != ''
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            // 本文の組み立ては infra/scripts/diff-comment.cjs にある。
            // cdkd diff の出力は PR 側が中身を決められるので、「何を仕込まれても
            // 壊れないか」を単体で試せる場所に置いてある
            // （infra/__tests__/diff-comment.test.ts）
            const { buildComment } = require(`${process.env.GITHUB_WORKSPACE}/infra/scripts/diff-comment.cjs`);
            const marker = '<!-- cdk-diff -->';
            const full = buildComment({
              raw: fs.readFileSync('infra/diff.txt', 'utf8'),
              marker,
            });
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: full,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: full,
              });
            }
