[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sommelier"
version = "0.1.0"
description = "Sakekasu sommelier agent (AgentCore Runtime, Strands SDK)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aws-opentelemetry-distro",
    "bedrock-agentcore >= 1.0.3",
    "boto3 >= 1.35.0",
    "botocore[crt] >= 1.35.0",
    "pyjwt[crypto] >= 2.9.0",
    "strands-agents >= 1.13.0",
]

[dependency-groups]
# テスト用。デプロイの梱包は `uv pip install -r pyproject.toml` で
# [project].dependencies だけを入れるため、ここに足しても Runtime には載らない
dev = ["pytest >= 8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# main.py / conversation_memory.py はプロジェクト直下にあるため import パスに加える
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["."]
