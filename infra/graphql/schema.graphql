# SakeCategory 列挙型
enum SakeCategory {
  NIHONSHU
  BEER
  WINE
  WHISKY
  SHOCHU
  OTHER
}

# 飲みきりステータス
enum DrinkingStatus {
  NOT_STARTED
  IN_PROGRESS
  FINISHED
}

# 購入記録
type PurchaseRecord {
  id: ID!
  owner: String!
  sakeName: String!
  storeName: String!
  price: Int!
  quantity: Int
  # まだ飲みきっていない本数。まとめ買いした記録を1本ずつ消費するために持つ。
  # 未設定の記録（この項目より前に作ったもの）は quantity と同じとみなす
  remainingQuantity: Int
  purchaseDate: AWSDate!
  category: SakeCategory!
  memo: String
  imageKey: String
  imageKeys: [String]
  drinkingStatus: DrinkingStatus
  openedAt: AWSDateTime

  # --- 詳細スペック（Issue #87）。すべて任意。銘柄名だけの記録もこれまで通り作れる ---
  # 蔵元（酒造名）。住所や所在地は含めない
  brewery: String
  # 産地の都道府県名または国名
  region: String
  # アルコール度数（%）
  alcoholPercentage: Float
  # 容量（ml）
  volumeMl: Int
  # 特定名称（純米大吟醸など）。銘柄名にも含まれるが、絞り込みに使えるよう単独でも持つ
  specificName: String
  # 精米歩合（%）
  ricePolishingRatio: Int
  # 日本酒度。甘口側は負の値になる
  sakeMeterValue: Float
  # 酸度
  acidity: Float
  # アミノ酸度
  aminoAcidity: Float
  # 酒米（品種名）
  riceVariety: String
  # 酵母
  yeast: String
  # ラベルに書かれた紹介文
  labelDescription: String
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
}

# 飲酒記録
type DrinkingRecord {
  id: ID!
  owner: String!
  sakeName: String!
  placeName: String!
  price: Int
  drinkingDate: AWSDate!
  category: SakeCategory!
  drinkingMethod: String!
  rating: Int!
  memo: String
  imageKey: String
  imageKeys: [String]
  # 在庫（購入記録）から登録した場合の紐づけ先。手入力の記録では null
  purchaseRecordId: ID

  # --- 詳細スペック（Issue #87）。すべて任意。銘柄名だけの記録もこれまで通り作れる ---
  # 蔵元（酒造名）。住所や所在地は含めない
  brewery: String
  # 産地の都道府県名または国名
  region: String
  # アルコール度数（%）
  alcoholPercentage: Float
  # 容量（ml）
  volumeMl: Int
  # 特定名称（純米大吟醸など）。銘柄名にも含まれるが、絞り込みに使えるよう単独でも持つ
  specificName: String
  # 精米歩合（%）
  ricePolishingRatio: Int
  # 日本酒度。甘口側は負の値になる
  sakeMeterValue: Float
  # 酸度
  acidity: Float
  # アミノ酸度
  aminoAcidity: Float
  # 酒米（品種名）
  riceVariety: String
  # 酵母
  yeast: String
  # ラベルに書かれた紹介文
  labelDescription: String
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
}

# ページネーション対応の一覧レスポンス（DynamoDB の 1MB 境界を超えても
# nextToken で続きを取得できるようにする）
type PurchaseRecordConnection {
  items: [PurchaseRecord!]!
  nextToken: String
}

type DrinkingRecordConnection {
  items: [DrinkingRecord!]!
  nextToken: String
}

# Presigned URL レスポンス
type PresignedUrlResponse {
  uploadUrl: String!
  key: String!
  """
  この URL で付与されるタグ（一時領域以外では null）。参考・調査用。

  **ヘッダとして送ってはいけない。** タグは署名済み URL のクエリ
  （x-amz-tagging）に入っているため、同名の HTTP ヘッダを添えると
  二重指定になり S3 が 403 SignatureDoesNotMatch を返す。
  クライアントは uploadUrl をそのまま PUT すればタグが付く。
  """
  taggingHeader: String
    @deprecated(
      reason: "名前に反してヘッダ送信は不可。送ると 403 になる。クライアントは参照しないこと"
    )
}

# OCR 項目ごとの確信度（0.0〜1.0）。低確信の項目はフォーム側で「要確認」表示に使う。
# 項目が読み取れなかった（null の）ときは必ず 0.0 が入る
type OcrFieldConfidence {
  sakeName: Float!
  category: Float!
  region: Float!
  alcoholPercentage: Float!
  # 以下は詳細スペックの自動抽出ぶん（Issue #88）
  brewery: Float!
  volumeMl: Float!
  specificName: Float!
  ricePolishingRatio: Float!
  sakeMeterValue: Float!
  acidity: Float!
  aminoAcidity: Float!
  riceVariety: Float!
  yeast: Float!
  labelDescription: Float!
}

# OCR 解析結果型。詳細スペックの項目名は PurchaseRecord / DrinkingRecord と揃えてある
type OcrResult {
  sakeName: String
  category: SakeCategory
  region: String
  alcoholPercentage: Float
  # --- 詳細スペック（Issue #88）。裏ラベルから読み取れたものだけ値が入る ---
  brewery: String
  volumeMl: Int
  specificName: String
  ricePolishingRatio: Int
  sakeMeterValue: Float
  acidity: Float
  aminoAcidity: Float
  riceVariety: String
  yeast: String
  labelDescription: String
  # 後方互換の総合確信度（= fieldConfidence.sakeName）
  confidence: Float!
  fieldConfidence: OcrFieldConfidence!
  rawTexts: [String!]!
}

# 銘柄名から起こしたテイスティングノート。
# 知らない銘柄では作り話をさせず、両方 null で返る
type TastingNote {
  tastingNote: String
  # おすすめの飲み方。ウイスキーのときだけ入る（日本酒は常に null）
  recommendedServing: String
}

# クエリ
type Query {
  getPurchaseRecord(id: ID!): PurchaseRecord
  listPurchaseRecords(limit: Int, nextToken: String): PurchaseRecordConnection!
  getDrinkingRecord(id: ID!): DrinkingRecord
  listDrinkingRecords(limit: Int, nextToken: String): DrinkingRecordConnection!
  # 単体版。フロントは getDownloadUrls を使うが、デプロイ前後で古い
  # フロントが動くため残してある
  getDownloadUrl(key: String!): String!
  # 一覧表示では画像の数だけ getDownloadUrl を呼ぶことになり、Lambda の
  # 同時実行枠を使い切って大半がスロットリングされていた。まとめて署名して
  # 1 回の呼び出しで返す。戻りの順序は keys と一対一で対応する
  getDownloadUrls(keys: [String!]!): [String!]!
}

# ミューテーション
type Mutation {
  createPurchaseRecord(input: CreatePurchaseRecordInput!): PurchaseRecord
  updatePurchaseRecord(input: UpdatePurchaseRecordInput!): PurchaseRecord
  deletePurchaseRecord(id: ID!): PurchaseRecord
  # 購入記録を「飲み中」にして開封日時を記録する。
  # すでに開封済み（飲み中・飲みきり）の場合は何も変更せず null を返す
  markPurchaseOpened(id: ID!): PurchaseRecord
  createDrinkingRecord(input: CreateDrinkingRecordInput!): DrinkingRecord
  updateDrinkingRecord(input: UpdateDrinkingRecordInput!): DrinkingRecord
  deleteDrinkingRecord(id: ID!): DrinkingRecord
  # temporary: true は OCR の事前アップロード用。記録がまだ存在しない段階の
  # 置き場（{sub}/tmp/{uploadId}/）へ保存し、S3 のライフサイクルで自動削除する。
  # 保存時に copyImages で正式な場所へ複製するまでが一連の流れ
  generateUploadUrl(
    recordType: String!
    recordId: String!
    contentType: String!
    fileName: String!
    temporary: Boolean
    # true なら一覧用サムネイルとして置く。キーは fileName から導出するため、
    # 呼び出し側は原画と同じ名前を渡す（`thumb_` 付きの名前は原画として拒否される）
    thumbnail: Boolean
    # これから置くファイルの大きさ（バイト、5MB まで）。署名に含めるので、
    # 返った URL ではこの大きさでしか PUT できない。省略すると Lambda が弾く。
    # 型を Int! にしないのは、フロントの変数（$fileSize: Int）と食い違うと
    # GraphQL の検証で落ち、インフラが先にデプロイされた間アップロードが止まるため
    fileSize: Int
  ): PresignedUrlResponse!
  # 複数画像（表・裏ラベルなど）を渡すと全画像を見て判定する。
  # additionalImageKeys は後方互換のための追加引数（省略時は imageKey のみ解析）
  analyzeSakeLabel(imageKey: String!, additionalImageKeys: [String!]): OcrResult!
  # 別の記録の画像を、指定した記録のものとして複製する。
  # 「在庫から飲む」で購入記録の写真を飲酒記録へ引き継ぐのに使う。
  #
  # キーの文字列だけを共有させると、片方の記録を削除したときに deleteImage が
  # S3 の実体を消して、もう片方の画像まで見えなくなる。実体ごと複製して
  # それぞれの記録が自分の画像を持つ形にする
  copyImages(sourceKeys: [String!]!, recordType: String!, recordId: ID!): [String!]!
  # 銘柄名からテイスティングノートを起こす。備考へ書くのは呼び出し側の仕事。
  # category は WHISKY / NIHONSHU のみ受け付け、それ以外はエラーになる
  # （ビール・ワイン等には記載しない、という要件を API 側でも担保する）
  generateTastingNote(sakeName: String!, category: SakeCategory!): TastingNote!
}

# 購入記録作成用 Input（id, owner, createdAt, updatedAt は自動生成）
input CreatePurchaseRecordInput {
  sakeName: String!
  storeName: String!
  price: Int!
  quantity: Int
  # 登録時は quantity と同じ値を入れる（1本も飲んでいない状態）
  remainingQuantity: Int
  purchaseDate: AWSDate!
  category: SakeCategory!
  memo: String
  imageKey: String
  # 要素は非 null。[String] だと [null] を受け付けてしまい、
  # リゾルバーの検証が null を触って実行時エラーになる
  imageKeys: [String!]
  drinkingStatus: DrinkingStatus

  # --- 詳細スペック（Issue #87）。すべて任意。銘柄名だけの記録もこれまで通り作れる ---
  # 蔵元（酒造名）。住所や所在地は含めない
  brewery: String
  # 産地の都道府県名または国名
  region: String
  # アルコール度数（%）
  alcoholPercentage: Float
  # 容量（ml）
  volumeMl: Int
  # 特定名称（純米大吟醸など）。銘柄名にも含まれるが、絞り込みに使えるよう単独でも持つ
  specificName: String
  # 精米歩合（%）
  ricePolishingRatio: Int
  # 日本酒度。甘口側は負の値になる
  sakeMeterValue: Float
  # 酸度
  acidity: Float
  # アミノ酸度
  aminoAcidity: Float
  # 酒米（品種名）
  riceVariety: String
  # 酵母
  yeast: String
  # ラベルに書かれた紹介文
  labelDescription: String
}

# 購入記録更新用 Input（id は必須、他はオプション）
input UpdatePurchaseRecordInput {
  id: ID!
  sakeName: String
  storeName: String
  price: Int
  quantity: Int
  remainingQuantity: Int
  purchaseDate: AWSDate
  category: SakeCategory
  memo: String
  drinkingStatus: DrinkingStatus
  openedAt: AWSDateTime
  # 登録後に写真を足せるようにするための項目（Issue #142）。
  # 送られたキーは create と同じく所有者を検証してから保存する。
  # 要素は非 null（[String] だと [null] を受け付け、検証が実行時エラーになる）
  imageKey: String
  imageKeys: [String!]

  # --- 詳細スペック（Issue #87）。すべて任意。銘柄名だけの記録もこれまで通り作れる ---
  # 蔵元（酒造名）。住所や所在地は含めない
  brewery: String
  # 産地の都道府県名または国名
  region: String
  # アルコール度数（%）
  alcoholPercentage: Float
  # 容量（ml）
  volumeMl: Int
  # 特定名称（純米大吟醸など）。銘柄名にも含まれるが、絞り込みに使えるよう単独でも持つ
  specificName: String
  # 精米歩合（%）
  ricePolishingRatio: Int
  # 日本酒度。甘口側は負の値になる
  sakeMeterValue: Float
  # 酸度
  acidity: Float
  # アミノ酸度
  aminoAcidity: Float
  # 酒米（品種名）
  riceVariety: String
  # 酵母
  yeast: String
  # ラベルに書かれた紹介文
  labelDescription: String
}

