# SakeCategory 列挙型
enum SakeCategory {
  NIHONSHU
  BEER
  WINE
  WHISKY
  SHOCHU
  OTHER
}

# 飲みきりステータス
enum DrinkingStatus {
  NOT_STARTED
  IN_PROGRESS
  FINISHED
}

# 購入記録
type PurchaseRecord {
  id: ID!
  owner: String!
  sakeName: String!
  storeName: String!
  price: Int!
  purchaseDate: AWSDate!
  category: SakeCategory!
  memo: String
  imageKey: String
  drinkingStatus: DrinkingStatus!
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
}

# 飲酒記録
type DrinkingRecord {
  id: ID!
  owner: String!
  sakeName: String!
  placeName: String!
  price: Int
  drinkingDate: AWSDate!
  category: SakeCategory!
  drinkingMethod: String!
  rating: Int!
  memo: String
  imageKey: String
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
}

# Presigned URL レスポンス
type PresignedUrlResponse {
  uploadUrl: String!
  key: String!
}

# OCR 解析結果型
type OcrResult {
  sakeName: String
  confidence: Float!
  rawTexts: [String!]!
}

# クエリ
type Query {
  getPurchaseRecord(id: ID!): PurchaseRecord
  listPurchaseRecords: [PurchaseRecord!]!
  getDrinkingRecord(id: ID!): DrinkingRecord
  listDrinkingRecords: [DrinkingRecord!]!
  getDownloadUrl(key: String!): String!
}

# ミューテーション
type Mutation {
  createPurchaseRecord(input: CreatePurchaseRecordInput!): PurchaseRecord
  updatePurchaseRecord(input: UpdatePurchaseRecordInput!): PurchaseRecord
  deletePurchaseRecord(id: ID!): PurchaseRecord
  createDrinkingRecord(input: CreateDrinkingRecordInput!): DrinkingRecord
  updateDrinkingRecord(input: UpdateDrinkingRecordInput!): DrinkingRecord
  deleteDrinkingRecord(id: ID!): DrinkingRecord
  generateUploadUrl(
    recordType: String!
    recordId: String!
    contentType: String!
    fileName: String!
  ): PresignedUrlResponse!
  analyzeSakeLabel(imageKey: String!): OcrResult!
}

# 購入記録作成用 Input（id, owner, createdAt, updatedAt は自動生成）
input CreatePurchaseRecordInput {
  sakeName: String!
  storeName: String!
  price: Int!
  purchaseDate: AWSDate!
  category: SakeCategory!
  memo: String
  imageKey: String
  drinkingStatus: DrinkingStatus
}

# 購入記録更新用 Input（id は必須、他はオプション）
input UpdatePurchaseRecordInput {
  id: ID!
  sakeName: String
  storeName: String
  price: Int
  purchaseDate: AWSDate
  category: SakeCategory
  memo: String
  drinkingStatus: DrinkingStatus
}

# 飲酒記録作成用 Input（id, owner, createdAt, updatedAt は自動生成）
input CreateDrinkingRecordInput {
  sakeName: String!
  placeName: String!
  price: Int
  drinkingDate: AWSDate!
  category: SakeCategory!
  drinkingMethod: String!
  rating: Int!
  memo: String
  imageKey: String
}

# 飲酒記録更新用 Input（id は必須、他はオプション）
input UpdateDrinkingRecordInput {
  id: ID!
  sakeName: String
  placeName: String
  price: Int
  drinkingDate: AWSDate
  category: SakeCategory
  drinkingMethod: String
  rating: Int
  memo: String
}
