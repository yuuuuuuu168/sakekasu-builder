# SakeCategory 列挙型
enum SakeCategory {
  NIHONSHU
  BEER
  WINE
  WHISKY
  SHOCHU
  OTHER
}

# 飲みきりステータス
enum DrinkingStatus {
  NOT_STARTED
  IN_PROGRESS
  FINISHED
}

# 購入記録
type PurchaseRecord {
  id: ID!
  owner: String!
  sakeName: String!
  storeName: String!
  price: Int!
  quantity: Int
  purchaseDate: AWSDate!
  category: SakeCategory!
  memo: String
  imageKey: String
  imageKeys: [String]
  drinkingStatus: DrinkingStatus
  openedAt: AWSDateTime
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
}

# 飲酒記録
type DrinkingRecord {
  id: ID!
  owner: String!
  sakeName: String!
  placeName: String!
  price: Int
  drinkingDate: AWSDate!
  category: SakeCategory!
  drinkingMethod: String!
  rating: Int!
  memo: String
  imageKey: String
  imageKeys: [String]
  # 在庫（購入記録）から登録した場合の紐づけ先。手入力の記録では null
  purchaseRecordId: ID
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
}

# ページネーション対応の一覧レスポンス（DynamoDB の 1MB 境界を超えても
# nextToken で続きを取得できるようにする）
type PurchaseRecordConnection {
  items: [PurchaseRecord!]!
  nextToken: String
}

type DrinkingRecordConnection {
  items: [DrinkingRecord!]!
  nextToken: String
}

# Presigned URL レスポンス
type PresignedUrlResponse {
  uploadUrl: String!
  key: String!
}

# OCR 項目ごとの確信度（0.0〜1.0）。低確信の項目はフォーム側で「要確認」表示に使う
type OcrFieldConfidence {
  sakeName: Float!
  category: Float!
  region: Float!
  alcoholPercentage: Float!
}

# OCR 解析結果型
type OcrResult {
  sakeName: String
  category: SakeCategory
  region: String
  alcoholPercentage: Float
  # 後方互換の総合確信度（= fieldConfidence.sakeName）
  confidence: Float!
  fieldConfidence: OcrFieldConfidence!
  rawTexts: [String!]!
}

# クエリ
type Query {
  getPurchaseRecord(id: ID!): PurchaseRecord
  listPurchaseRecords(limit: Int, nextToken: String): PurchaseRecordConnection!
  getDrinkingRecord(id: ID!): DrinkingRecord
  listDrinkingRecords(limit: Int, nextToken: String): DrinkingRecordConnection!
  # 単体版。フロントは getDownloadUrls を使うが、デプロイ前後で古い
  # フロントが動くため残してある
  getDownloadUrl(key: String!): String!
  # 一覧表示では画像の数だけ getDownloadUrl を呼ぶことになり、Lambda の
  # 同時実行枠を使い切って大半がスロットリングされていた。まとめて署名して
  # 1 回の呼び出しで返す。戻りの順序は keys と一対一で対応する
  getDownloadUrls(keys: [String!]!): [String!]!
}

# ミューテーション
type Mutation {
  createPurchaseRecord(input: CreatePurchaseRecordInput!): PurchaseRecord
  updatePurchaseRecord(input: UpdatePurchaseRecordInput!): PurchaseRecord
  deletePurchaseRecord(id: ID!): PurchaseRecord
  # 購入記録を「飲み中」にして開封日時を記録する。
  # すでに開封済み（飲み中・飲みきり）の場合は何も変更せず null を返す
  markPurchaseOpened(id: ID!): PurchaseRecord
  createDrinkingRecord(input: CreateDrinkingRecordInput!): DrinkingRecord
  updateDrinkingRecord(input: UpdateDrinkingRecordInput!): DrinkingRecord
  deleteDrinkingRecord(id: ID!): DrinkingRecord
  generateUploadUrl(
    recordType: String!
    recordId: String!
    contentType: String!
    fileName: String!
  ): PresignedUrlResponse!
  # 複数画像（表・裏ラベルなど）を渡すと全画像を見て判定する。
  # additionalImageKeys は後方互換のための追加引数（省略時は imageKey のみ解析）
  analyzeSakeLabel(imageKey: String!, additionalImageKeys: [String!]): OcrResult!
}

# 購入記録作成用 Input（id, owner, createdAt, updatedAt は自動生成）
input CreatePurchaseRecordInput {
  sakeName: String!
  storeName: String!
  price: Int!
  quantity: Int
  purchaseDate: AWSDate!
  category: SakeCategory!
  memo: String
  imageKey: String
  imageKeys: [String]
  drinkingStatus: DrinkingStatus
}

# 購入記録更新用 Input（id は必須、他はオプション）
input UpdatePurchaseRecordInput {
  id: ID!
  sakeName: String
  storeName: String
  price: Int
  quantity: Int
  purchaseDate: AWSDate
  category: SakeCategory
  memo: String
  drinkingStatus: DrinkingStatus
  openedAt: AWSDateTime
}

# 飲酒記録作成用 Input（id, owner, createdAt, updatedAt は自動生成）
input CreateDrinkingRecordInput {
  sakeName: String!
  placeName: String!
  price: Int
  drinkingDate: AWSDate!
  category: SakeCategory!
  drinkingMethod: String!
  rating: Int!
  memo: String
  imageKey: String
  imageKeys: [String]
  purchaseRecordId: ID
}

# 飲酒記録更新用 Input（id は必須、他はオプション）
input UpdateDrinkingRecordInput {
  id: ID!
  sakeName: String
  placeName: String
  price: Int
  drinkingDate: AWSDate
  category: SakeCategory
  drinkingMethod: String
  rating: Int
  memo: String
}
